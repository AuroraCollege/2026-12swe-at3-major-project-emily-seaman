<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pantry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>

<body>

<header>
    <h1>Your Pantry</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/add">Add Recipe</a>
        <a href="/pantry">Pantry</a>
        <a href="/shopping">Shopping List</a>
    </nav>
</header>

<main>
    <section>
        <h2>Pantry Items</h2>

        {% if pantry %}
            <ul class="pantry-list">
                {% for item in pantry %}
                    <li>{{ item }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>Your pantry is empty. Add some items below.</p>
        {% endif %}
    </section>

    <section class="form-section">
        <h2>Add Pantry Item</h2>

        <form method="POST" action="/add_pantry_item">
            <label>Item Name</label>
            <input type="text" name="item" required>

            <button type="submit">Add Item</button>
        </form>
    </section>
</main>

</body>
</html>
